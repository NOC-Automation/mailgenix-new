services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.local
    ports:
      - "8080:8080"
    env_file:
      - automation/.env.local
    volumes:
      - ./automation:/app
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8080"
